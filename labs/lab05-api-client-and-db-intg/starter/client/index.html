<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 Client</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Lab 5 Inventory Client</h1>
        <p>
          This starter client can load items and create a new item. Extend it
          as you add more API routes.
        </p>

        <div class="actions">
          <button id="load-items" type="button">Load Items</button>
        </div>

        <form id="add-item-form">
          <label>
            Name
            <input id="item-name" name="name" type="text" required>
          </label>

          <label>
            Quantity
            <input id="item-quantity" name="quantity" type="number" min="0" required>
          </label>

          <button type="submit">Add Item</button>
        </form>

        <div id="edit-modal" class="modal hidden">
          <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <h2>Edit Item</h2>
            <form id="edit-item-form">
              <label>
                Name
                <input id="edit-item-name" name="name" type="text" required>
              </label>

              <label>
                Quantity
                <input id="edit-item-quantity" name="quantity" type="number" min="0" required>
              </label>
              <p id="edit-status" class="status"></p>
              <button type="submit">Save Changes</button>
            </form>
          </div>
        </div>

        <p id="status" class="status">Ready.</p>

        <ul id="items" class="items"></ul>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
